name: Sync anime list from Discord

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub's floor is 5 min; expect real drift
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-anime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the Anime section from the Discord message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/sync_anime.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "anime list unchanged - nothing to commit"
            exit 0
          fi
          git add media.html assets/media anime-aliases.json
          git commit -m "Media: sync Anime section from Discord"
          git push
